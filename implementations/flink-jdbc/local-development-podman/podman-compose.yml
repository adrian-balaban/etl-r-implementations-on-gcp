# flink-jdbc local stack — vendored from ../../flink/local-development-podman/podman-compose.yml (its relative
# paths resolve against its own folder, so it cannot be layered from here). Differences: a second Postgres plays
# the Source System; names and host ports are distinct so both lanes' stacks can run side by side; the Flink
# image and the mock are built from ../../flink, not copied.
version: '3.8'

networks:
  etlr-jdbc-net:
    driver: bridge

services:
  source-postgres:
    image: docker.io/library/postgres:16
    container_name: etlr-jdbc-source
    networks: [etlr-jdbc-net]
    ports: ["5443:5432"]
    environment:
      POSTGRES_USER: mig
      POSTGRES_PASSWORD: mig
      POSTGRES_DB: source
    volumes:
      - ../sql/source-init.sql:/docker-entrypoint-initdb.d/01-source-init.sql:Z
    healthcheck:
      test: pg_isready -U mig -d source
      interval: 5s
      retries: 10

  lane-postgres:
    image: docker.io/library/postgres:16
    container_name: etlr-jdbc-lane
    networks: [etlr-jdbc-net]
    ports: ["5442:5432"]
    environment:
      POSTGRES_USER: mig
      POSTGRES_PASSWORD: mig
      POSTGRES_DB: mig
    volumes:
      - ../../flink/sql/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:Z
      - ../sql/postgres-init-jdbc.sql:/docker-entrypoint-initdb.d/02-init-jdbc.sql:Z
    healthcheck:
      test: pg_isready -U mig -d mig
      interval: 5s
      retries: 10

  redpanda:
    image: docker.io/redpandadata/redpanda:latest
    container_name: etlr-jdbc-redpanda
    networks: [etlr-jdbc-net]
    ports: ["19092:19092"]
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:19092
    healthcheck:
      test: rpk cluster health | grep -q 'Healthy:.*true'
      interval: 10s
      retries: 10
      start_period: 10s

  redpanda-topics:
    image: docker.io/redpandadata/redpanda:latest
    container_name: etlr-jdbc-redpanda-topics
    networks: [etlr-jdbc-net]
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: >
      sh -c "
      rpk topic create target-system-target -p 1 -r 1 --brokers redpanda:29092 || true;
      rpk topic create target-system-confirmations -p 1 -r 1 --brokers redpanda:29092 || true;
      rpk topic create target-system-rejections -p 1 -r 1 --brokers redpanda:29092 || true;
      echo topics ready"
    restart: "no"

  flink-jobmanager:
    build:
      context: ../../flink/local-development-podman/flink-image
    container_name: etlr-jdbc-flink-jm
    networks: [etlr-jdbc-net]
    ports: ["8082:8081"]
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.numberOfTaskSlots: 4
        rest.bind-address: 0.0.0.0
        rest.bind-port: 8081
        execution.runtime-mode: BATCH
    volumes:
      - ../work:/opt/mig/work:Z
    depends_on:
      lane-postgres:
        condition: service_healthy

  flink-taskmanager:
    build:
      context: ../../flink/local-development-podman/flink-image
    container_name: etlr-jdbc-flink-tm
    networks: [etlr-jdbc-net]
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.numberOfTaskSlots: 4
        execution.runtime-mode: BATCH
    volumes:
      - ../work:/opt/mig/work:Z
    depends_on:
      - flink-jobmanager

  target-system-mock:
    build:
      context: ../../flink
      dockerfile: gcp/docker/Dockerfile.javaapp
      args:
        MIG_MODULE: target-system-mock
    container_name: etlr-jdbc-mock
    networks: [etlr-jdbc-net]
    ports: ["8099:8098"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      TARGET_SYSTEM_TARGET_TOPIC: target-system-target
      TARGET_SYSTEM_CONFIRMATION_TOPIC: target-system-confirmations
      TARGET_SYSTEM_PORT: "8098"
    depends_on:
      redpanda:
        condition: service_healthy

  kafka-ui:
    image: docker.io/provectuslabs/kafka-ui:latest
    container_name: etlr-jdbc-kafka-ui
    networks: [etlr-jdbc-net]
    ports: ["8089:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: etlr-jdbc-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:29092
    depends_on:
      - redpanda
