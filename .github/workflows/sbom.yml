name: sbom

# [K16-1 K16-3] The stacks from build files, at build time — an SBOM per lane, not an ADL inventory.
# The gate is a non-empty artifact: a failed plugin run cannot pass as an empty file.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "25" # the highest lane target (beam-dataflow)
          cache: maven
          cache-dependency-path: implementations/*/pom.xml
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Warm the CycloneDX plugin once, so the lanes reuse the cached copy
        run: |
          for attempt in 1 2 3 4; do
            mvn -B -q org.apache.maven.plugins:maven-dependency-plugin:get \
              -Dartifact=org.cyclonedx:cyclonedx-maven-plugin:2.8.0 && break
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 60))
          done
      - name: Maven lanes — one aggregate CycloneDX BOM per reactor
        run: |
          set -euo pipefail
          for lane in flink flink-jdbc beam-dataflow; do
            pom="implementations/$lane/pom.xml"
            [ -f "$pom" ] || continue
            echo "::group::$lane"
            # Maven Central rate-limits (HTTP 429) under load; retry with backoff, bounded.
            for attempt in 1 2 3 4; do
              if mvn -B -q -f "$pom" org.cyclonedx:cyclonedx-maven-plugin:2.8.0:makeAggregateBom \
                   -DoutputFormat=json -DoutputName="sbom-$lane"; then
                break
              fi
              [ "$attempt" = 4 ] && { echo "Maven Central kept failing for $lane"; exit 1; }
              echo "attempt $attempt failed for $lane; retrying in $((attempt * 60))s"
              sleep $((attempt * 60))
            done
            test -s "implementations/$lane/target/sbom-$lane.json" || { echo "empty SBOM for $lane"; exit 1; }
            echo "::endgroup::"
          done
      - name: Python — CycloneDX from the Beam requirements
        run: |
          set -euo pipefail
          uvx --from cyclonedx-bom==4.1.3 cyclonedx-py requirements \
            implementations/beam-dataflow/requirements.txt -o sbom-python.json
          test -s sbom-python.json || { echo "empty Python SBOM"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            implementations/*/target/sbom-*.json
            sbom-python.json
          if-no-files-found: error
