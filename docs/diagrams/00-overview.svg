<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1677px;height:243px;background:#FFFFFF;" width="1677px" height="243px" viewBox="0 0 1677 243" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="663.949" y="24.966" fill="#000" font-size="14" textLength="342.103" font-weight="700">Two doors, one equation, three implementations</text></g><!--entity SRC--><g class="entity" data-qualified-name="SRC" id="ent0001" data-source-line="14"><rect x="6" y="52.068" width="196.819" height="58.136" fill="#EEF4FA" style="stroke:#4A7EBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="53.52" y="77.034" fill="#000" font-size="14" textLength="101.78" font-weight="700">Source System</text><text x="16" y="96.102" fill="#000" font-size="14" textLength="176.819">full snapshot, once per run</text></g><!--entity INT--><g class="entity" data-qualified-name="INT" id="ent0002" data-source-line="15"><rect x="221.5" y="52.068" width="91.82" height="58.136" fill="#EEF4FA" style="stroke:#4A7EBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="244.933" y="77.034" fill="#000" font-size="14" textLength="44.954" font-weight="700">intake</text><text x="231.5" y="96.102" fill="#000" font-size="14" textLength="71.82">parse door</text></g><!--entity CUR--><g class="entity" data-qualified-name="CUR" id="ent0003" data-source-line="16"><rect x="331.5" y="52.068" width="217.721" height="58.136" fill="#EEF4FA" style="stroke:#4A7EBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="387.693" y="77.034" fill="#000" font-size="14" textLength="105.336" font-weight="700">curate + enrich</text><text x="341.5" y="96.102" fill="#000" font-size="14" textLength="197.721">adds columns, rejects nothing</text></g><!--entity PROD--><g class="entity" data-qualified-name="PROD" id="ent0004" data-source-line="17"><rect x="568" y="52.068" width="181.447" height="58.136" fill="#EEF4FA" style="stroke:#4A7EBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="630.017" y="77.034" fill="#000" font-size="14" textLength="57.414" font-weight="700">produce</text><text x="578" y="96.102" fill="#000" font-size="14" textLength="161.447">map door · schema door</text></g><!--entity TGT--><g class="entity" data-qualified-name="TGT" id="ent0005" data-source-line="18"><rect x="767.5" y="52.068" width="193.949" height="58.136" fill="#EEF4FA" style="stroke:#4A7EBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="814.222" y="77.034" fill="#000" font-size="14" textLength="100.506" font-weight="700">Target System</text><text x="777.5" y="96.102" fill="#000" font-size="14" textLength="173.949">load on Kafka, idempotent</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="26"><path d="M503,146.068 L503,226.892 A0,0 0 0 0 503,226.892 L813.679,226.892 A0,0 0 0 0 813.679,226.892 L813.679,156.068 L803.679,146.068 L662.5,146.068 L658.5,110.077 L654.5,146.068 L503,146.068 A0,0 0 0 0 503,146.068" style="stroke:#D6C36B;stroke-width:0.5;" fill="#FFFBE6"/><path d="M803.679,146.068 L803.679,156.068 L813.679,156.068 L803.679,146.068" style="stroke:#D6C36B;stroke-width:0.5;" fill="#FFFBE6"/><text x="534.896" y="164.965" fill="#000" font-size="13" textLength="48.503" font-weight="700">written</text><text x="586.779" y="164.965" fill="#000" font-size="13" textLength="186.004">→ becomes a target document</text><text x="509" y="182.671" fill="#000" font-size="13" textLength="53.469" font-weight="700">rejected</text><text x="565.849" y="182.671" fill="#000" font-size="13" textLength="232.83">→ named, with an enumerated reason</text><text x="563.522" y="200.377" fill="#000" font-size="13" textLength="180.635">`src_read = written + rejected`</text><text x="554.565" y="218.083" fill="#000" font-size="13" textLength="167.895">a run that does not balance</text><text x="725.84" y="218.083" fill="#000" font-size="13" textLength="27.274" font-weight="700">fails</text></g><!--entity SPEC--><g class="entity" data-qualified-name="SPEC" id="ent0013" data-source-line="32"><rect x="980" y="52.068" width="147.12" height="58.136" fill="#EEF4FA" style="stroke:#4A7EBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="990" y="77.034" fill="#000" font-size="14" textLength="127.12" font-weight="700">spec/PIPELINE.md</text><text x="995.117" y="96.102" fill="#000" font-size="14" textLength="116.886">the one definition</text></g><!--entity IMPL--><g class="entity" data-qualified-name="IMPL" id="ent0014" data-source-line="33"><rect x="1145.5" y="52.068" width="241.829" height="58.136" fill="#EEF4FA" style="stroke:#4A7EBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1203.352" y="77.034" fill="#000" font-size="14" textLength="126.126" font-weight="700">implementations/</text><text x="1155.5" y="96.102" fill="#000" font-size="14" textLength="221.829">Beam/Dataflow · Flink · Flink-JDBC</text></g><!--entity ORACLE--><g class="entity" data-qualified-name="ORACLE" id="ent0015" data-source-line="34"><rect x="1405.5" y="52.068" width="229.607" height="58.136" fill="#EEF4FA" style="stroke:#4A7EBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1449.632" y="77.034" fill="#000" font-size="14" textLength="141.343" font-weight="700">oracle + comparator</text><text x="1415.5" y="96.102" fill="#000" font-size="14" textLength="209.607">row for row, never counts alone</text></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="40"><path d="M1380,164.068 L1380,209.48 A0,0 0 0 0 1380,209.48 L1661.078,209.48 A0,0 0 0 0 1661.078,209.48 L1661.078,174.068 L1651.078,164.068 L1524.5,164.068 L1520.5,110.077 L1516.5,164.068 L1380,164.068 A0,0 0 0 0 1380,164.068" style="stroke:#D6C36B;stroke-width:0.5;" fill="#FFFBE6"/><path d="M1651.078,164.068 L1651.078,174.068 L1661.078,174.068 L1651.078,164.068" style="stroke:#D6C36B;stroke-width:0.5;" fill="#FFFBE6"/><text x="1403.394" y="182.965" fill="#000" font-size="13" textLength="225.29">same spec, several implementations:</text><text x="1386" y="200.671" fill="#000" font-size="13" textLength="260.078">conformance means the same everywhere</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-link-type="dependency"><polygon points="221.278,81.068,212.278,77.068,216.278,81.068,212.278,85.068,221.278,81.068" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M203.191,81.068 C209.22,81.068 210.249,81.068 216.278,81.068" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-link-type="dependency"><polygon points="331.115,81.068,322.115,77.068,326.115,81.068,322.115,85.068,331.115,81.068" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M313.791,81.068 C319.566,81.068 320.34,81.068 326.115,81.068" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-link-type="dependency"><polygon points="567.739,81.068,558.739,77.068,562.739,81.068,558.739,85.068,567.739,81.068" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M549.926,81.068 C555.863,81.068 556.801,81.068 562.739,81.068" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk9" data-link-type="dependency"><polygon points="767.07,81.068,758.07,77.068,762.07,81.068,758.07,85.068,767.07,81.068" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M749.027,81.068 C755.042,81.068 756.056,81.068 762.07,81.068" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0013" data-entity-2="ent0014" id="lnk16" data-link-t