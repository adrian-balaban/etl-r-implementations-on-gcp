nchor="start">beam-dataflow</text><line x1="454" y1="366" x2="454" y2="388" stroke="#e6e5e1"/><path d="M454,370 H590.0 a4,4 0 0 1 4,4 V382 a4,4 0 0 1 -4,4 H454 Z" fill="#1baf7a"/><text x="600.0" y="382" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">2h 31m</text><text x="672" y="274" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start">Estimated cost ³</text><text x="672" y="291" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start">USD, list prices × timed resource-hours</text><text x="672" y="321" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">flink</text><line x1="776" y1="306" x2="776" y2="328" stroke="#e6e5e1"/><path d="M776,310 H826.0772532188842 a4,4 0 0 1 4,4 V322 a4,4 0 0 1 -4,4 H776 Z" fill="#2a78d6"/><text x="836.0772532188842" y="322" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">$0.90</text><text x="672" y="351" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">flink-jdbc</text><line x1="776" y1="336" x2="776" y2="358" stroke="#e6e5e1"/><path d="M776,340 H828.480686695279 a4,4 0 0 1 4,4 V352 a4,4 0 0 1 -4,4 H776 Z" fill="#eb6834"/><text x="838.480686695279" y="352" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">$0.94</text><text x="672" y="381" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">beam-dataflow</text><line x1="776" y1="366" x2="776" y2="388" stroke="#e6e5e1"/><path d="M776,370 H912.0 a4,4 0 0 1 4,4 V382 a4,4 0 0 1 -4,4 H776 Z" fill="#1baf7a"/><text x="922.0" y="382" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">$2.33</text><text x="28" y="416" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">¹ Kafka took ~20 min in the flink run and ~10 in flink-jdbc's (cloud variance). Beam builds its images after the first apply and lost ~10 min to a hung build script.</text><text x="28" y="433" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">² beam needed one stale-mock retry (~10 min); without it ~28 min. flink-jdbc also spent 4m 20s loading the 200k rows into its source database.</text><text x="28" y="450" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">³ An estimate, not an invoice (list prices × timed resource-hours; no free tiers or discounts): see cost-estimate.md.</text></svg>