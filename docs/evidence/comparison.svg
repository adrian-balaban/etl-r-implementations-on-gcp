<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 478" width="1000" height="478" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><title id="t">Comparison of the three implementations on GCP</title><desc id="d">Six small bar charts: GCP resources, ramp-up, 200k run time, ramp-down, total GCP time and estimated cost for flink, flink-jdbc and beam-dataflow.</desc><rect x="0.5" y="0.5" width="999" height="477" rx="10" fill="#fcfcfb" stroke="#d9d8d3"/><text x="28" y="38" font-size="20" fill="#0b0b0b" font-weight="700" text-anchor="start">Same counts, different time and cost</text><text x="28" y="60" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start">Three implementations on real GCP, same inputs: the 55-record fixture and 200,000 records. Lower is better in every panel.</text><rect x="28" y="76" width="12" height="12" rx="3" fill="#2a78d6"/><text x="46" y="87" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">flink</text><rect x="168" y="76" width="12" height="12" rx="3" fill="#eb6834"/><text x="186" y="87" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">flink-jdbc</text><rect x="308" y="76" width="12" height="12" rx="3" fill="#1baf7a"/><text x="326" y="87" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">beam-dataflow</text><text x="28" y="124" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start">GCP resources</text><text x="28" y="141" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start">Terraform-managed resources created</text><text x="28" y="171" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">flink</text><line x1="132" y1="156" x2="132" y2="178" stroke="#e6e5e1"/><path d="M132,160 H250.71604938271605 a4,4 0 0 1 4,4 V172 a4,4 0 0 1 -4,4 H132 Z" fill="#2a78d6"/><text x="260.71604938271605" y="172" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">71</text><text x="28" y="201" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">flink-jdbc</text><line x1="132" y1="186" x2="132" y2="208" stroke="#e6e5e1"/><path d="M132,190 H268.0 a4,4 0 0 1 4,4 V202 a4,4 0 0 1 -4,4 H132 Z" fill="#eb6834"/><text x="278.0" y="202" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">81</text><text x="28" y="231" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">beam-dataflow</text><line x1="132" y1="216" x2="132" y2="238" stroke="#e6e5e1"/><path d="M132,220 H257.6296296296296 a4,4 0 0 1 4,4 V232 a4,4 0 0 1 -4,4 H132 Z" fill="#1baf7a"/><text x="267.6296296296296" y="232" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">75</text><text x="350" y="124" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start">Ramp-up ¹</text><text x="350" y="141" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start">billing start → first input staged</text><text x="350" y="171" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">flink</text><line x1="454" y1="156" x2="454" y2="178" stroke="#e6e5e1"/><path d="M454,160 H514.869109947644 a4,4 0 0 1 4,4 V172 a4,4 0 0 1 -4,4 H454 Z" fill="#2a78d6"/><text x="524.869109947644" y="172" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">23m 36s</text><text x="350" y="201" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">flink-jdbc</text><line x1="454" y1="186" x2="454" y2="208" stroke="#e6e5e1"/><path d="M454,190 H489.62696335078533 a4,4 0 0 1 4,4 V202 a4,4 0 0 1 -4,4 H454 Z" fill="#eb6834"/><text x="499.62696335078533" y="202" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">14m 25s</text><text x="350" y="231" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">beam-dataflow</text><line x1="454" y1="216" x2="454" y2="238" stroke="#e6e5e1"/><path d="M454,220 H590.0 a4,4 0 0 1 4,4 V232 a4,4 