<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><title id="t">Records at every hop</title><desc id="d">Counts at each stage for the 55-record and 200,000-record runs, with the three parse rejects and the two map/schema rejects.</desc><rect x="0.5" y="0.5" width="979" height="469" rx="10" fill="#fcfcfb" stroke="#d9d8d3"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><text x="28" y="36" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start">Records at every hop: the same five defects leave at the same two doors, at any scale</text><text x="28" y="58" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start">Counts from BigQuery and the run ledger. Door 1 = parse (intake). Door 2 = map and schema (produce).</text><text x="28" y="92" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start">Fixture run</text><rect x="28" y="106" width="150" height="70" rx="8" fill="#eef6f1" stroke="#1baf7a"/><text x="103.0" y="130" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">source read</text><text x="103.0" y="156" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="middle">55</text><line x1="180" y1="141" x2="214" y2="141" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/><rect x="218" y="106" width="150" height="70" rx="8" fill="#eef6f1" stroke="#1baf7a"/><text x="293.0" y="130" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">account_src</text><text x="293.0" y="156" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="middle">52</text><line x1="370" y1="141" x2="404" y2="141" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/><rect x="408" y="106" width="150" height="70" rx="8" fill="#eef6f1" s