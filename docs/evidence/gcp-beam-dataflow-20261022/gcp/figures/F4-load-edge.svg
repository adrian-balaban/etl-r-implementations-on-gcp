<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><title id="t">The load edge</title><desc id="d">Stacked bars of accepted, duplicate and unsettled documents for the failed and successful load attempts of both runs.</desc><rect x="0.5" y="0.5" width="979" height="399" rx="10" fill="#fcfcfb" stroke="#d9d8d3"/><text x="28" y="36" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start">The load edge: a stale mock fails closed, a fresh one settles every document</text><text x="28" y="58" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start">Loader report per attempt (load/ACCOUNT.RPT). Nothing is ever lost silently: documents the Target System did not confirm are counted as unsettled and the task fails.</text><text x="28" y="88" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">Fixture — attempt 1</text><text x="28" y="104" font-size="11.5" fill="#d03b3b" font-weight="normal" text-anchor="start">published 50 · mock instance 41 min old</text><rect x="300.0" y="76" width="518.0" height="22" rx="3" fill="#d03b3b"/><text x="560.0" y="92" font-size="11.5" fill="#ffffff" font-weight="600" text-anchor="middle">unsettled 50</text><text x="28" y="158" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">Fixture — attempt 2 (mock recycled)</text><text x="28" y="174" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start">published 50</text><rect x="300.0" y="146" width="133.2" height="22" rx="3" fill="#1baf7a"/><text x="367.6" y="162" font-size="11.5" fill="#ffffff" font-weight="600" text-anchor="middle">accepted 13</text><rect x="435.2" y="146" width="382.8" height="22" rx="3" fill="#86d4b8"/><text x="627.6" y="162" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">duplicate 37</text><text x="28" y="228" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">200k — attempt 1</text><text x="28" y="244" font-size="11.5" fill="#d03b3b" font-weight="normal" text-anchor="start">published 200,000 · mock instance 34.5 min old</text><rect x="300.0" y="216" width="518.0" height="22" rx="3" fill="#d03b3b"/><text x="560.0" y="232" font-size="11.5" fill="#ffffff" font-weight="600" text-anchor="middle">unsettled 200,000</text><text x="28" y="298" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">200k — attempt 2 (mock recycled)</text><text x="28" y="314" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start">published 200,000</text><rect x="300.0" y="286" width="357.7" height="22" rx="3" fill="#1baf7a"/><text x="479.84069999999997" y="302" font-size="11.5" fill="#ffffff" font-weight="600" text-anchor="middle">accepted 138,339</text><rect x="659.7" y="286" width="158.3" height="22" rx="3" fill="#86d4b8"/><text x="739.8407" y="302" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">duplicate 61,661</text><text x="28" y="378" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">Mock counters after the 200k run (instance since the last recycle): received 723,390 = 200,000 accepted + 523,390 duplicates; distinct accounts 200,000; rejections 0.</text><text x="28" y="398" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">Both attempts publish the same keyed documents, so the Target System's idempotency absorbs the repeats: accepted stays 200,000.</text></svg>